<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23000%22/%3E%3Crect x=%229%22 y=%2214%22 width=%226%22 height=%2220%22 fill=%22%23f2f2f2%22/%3E%3Crect x=%2249%22 y=%2230%22 width=%226%22 height=%2220%22 fill=%22%23f2f2f2%22/%3E%3Crect x=%2233%22 y=%2223%22 width=%226%22 height=%226%22 fill=%22%23f2f2f2%22/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f2f2f2;--dim:#8c8c8c;--line:#2b2b2b;--err:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line);min-height:36px}
.brand{font-weight:700;letter-spacing:.35em}
.status{flex:1;min-width:0;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:6px}
button{font:inherit;color:var(--fg);background:none;border:1px solid var(--fg);padding:4px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--fg);color:var(--bg)}
button:disabled{opacity:.4;cursor:default}
button.ghost{border-color:var(--line);color:var(--dim)}
button.ghost:hover:not(:disabled){border-color:var(--fg);background:none;color:var(--fg)}
input{font:inherit;color:var(--fg);background:#0b0b0b;border:1px solid var(--line);padding:5px 8px;min-width:0;flex:1}
input:focus{outline:none;border-color:var(--fg)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#field{display:block;touch-action:none}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.78);overflow:auto}
.card{width:min(460px,100%);max-height:100%;overflow:auto;border:1px solid var(--line);background:#000;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:6px 0 0;font-size:11px;font-weight:400;letter-spacing:.25em;color:var(--dim)}
.card h2:first-child{margin-top:0}
.card p{margin:0}
.row{display:flex;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:6px 8px;min-height:36px}
.item .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .lbl{color:var(--dim);width:8.5em;flex:none;white-space:nowrap}
.dim{color:var(--dim)}
.err{color:var(--err)}
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;pointer-events:none;padding:14px 20px;background:rgba(0,0,0,.65);max-width:calc(100% - 32px)}
.msg button{pointer-events:auto}
.msg .big{font-size:40px;font-weight:700;letter-spacing:.2em;line-height:1.1}
.msg .sub{color:var(--dim)}
.msg[hidden],.panel[hidden]{display:none}
body[data-view=tool] #field,body[data-view=tool] .bar{display:none}
body[data-view=tool] .panel{background:none;padding:12px 14px}
body[data-view=tool] .card{border:0;padding:0;width:100%;gap:12px}
@media (max-width:420px){.bar{gap:8px;padding:6px 10px}.brand{letter-spacing:.2em}.msg .big{font-size:28px}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <span class="brand">PONG</span>
    <span id="status" class="status">connecting…</span>
    <span id="barBtns" class="btns"></span>
  </header>
  <main id="stage">
    <canvas id="field" width="800" height="512"></canvas>
    <div id="msg" class="msg" hidden></div>
    <div id="panel" class="panel" hidden></div>
  </main>
</div>
<script>
'use strict';
// %pong frontend.
//
// A table lives on the ship that opened it; that ship's agent decides who holds
// which paddle (first come, first served). Everything about the game happens in
// the browsers:
//
// - The two players' pages connect directly over a WebRTC data channel. Their
//   ships only carry the handshake, and carry the game too if WebRTC can't
//   connect. The path is chosen when a match starts, so a match never mixes the
//   two and messages can't overtake each other.
// - Each side is the authority for hits and misses on ITS OWN paddle. Between
//   those events the ball moves in straight lines, so both sides simulate it;
//   the far side's outcome is predicted, then corrected by the owner's verdict
//   ('b' or 'pt'). Remote events are fast-forwarded by half the round trip.
// - Watchers connect over WebRTC to one player, who streams a snapshot, then
//   paddles 5x a second plus every ball and point event. No ship involved.

// ---------- field (logical units; everyone must agree) ----------
const W=800,H=500,BALL=12,PW=12,PH=80,PX=24;
const LFACE=PX+PW,RFACE=W-PX-PW;                // the faces the ball strikes
const LEFT=0,RIGHT=1;
const SPEED0=420,SPEEDUP=1.05,SPEEDMAX=980,MAXANG=Math.PI*0.3;
// CPU: predicts where the ball will reach its paddle (bounces included), takes a
// moment to read each shot, misjudges more on fast balls, and aims off-centre to
// send the ball away from you. Tuned offline: a player who returns 90% of balls
// wins ~46% of points (rallies ~10 hits), 75% wins ~17%.
const CPU_SPEED=420,CPU_ACCEL=3000,CPU_REACT=[0.14,0.26],CPU_ERR=0.08,CPU_FLOOR=0.30,CPU_WHIFF=0.04,CPU_AIM=[0.25,0.75];
const WT=6,VH=H+2*WT;                            // walls drawn outside the field: physics unchanged
const STEP=1/240,WIN=11;
const SERVE_MS=1000,COUNT_MS=3000,PING_MS=2000,HI_MS=1000,STALL_MS=5000;
const PADDLE_RELAY_MS=60,PADDLE_RTC_MS=33;       // ship path is dearer, so sparser
const RTC_WAIT=4000,RTC_TIMEOUT=8000,WATCH_MS=200,WATCH_TRY_MS=6000,MAX_WATCHERS=8;
const ICE=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}];
// Seats: a seated page tells the host it's still here every HEARTBEAT_MS (the host
// frees a seat after 90s of silence), and gives the paddle up itself after IDLE_MS
// with no mouse or keyboard in this frame. let, so they can be tuned from the console.
let IDLE_MS=120000,IDLE_WARN_MS=20000,HEARTBEAT_MS=30000;
const SHIP_RE=/^~[a-z]{3}(?:[a-z]{3})?(?:-[a-z]{6})*(?:--[a-z]{6}(?:-[a-z]{6})*)?$/;

const $=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function button(label,fn,cls){const b=el('button',cls||'',label);b.addEventListener('click',fn);return b}
function para(text,cls){return el('p',cls||'',text)}
function rid(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>(x%36).toString(36)).join('')}
const clampPad=y=>Math.max(PH/2,Math.min(H-PH/2,y));

// ---------- sound ----------
let AC=null;
function unlockAudio(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
}
function tone(freq,ms,vol){
  if(!AC||AC.state!=='running')return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='square';o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+ms/1000+0.02);
}
const sfx={paddle:()=>tone(480,55,0.10),wall:()=>tone(240,35,0.06),score:()=>tone(160,300,0.10)};
addEventListener('pointerdown',unlockAudio,true);
addEventListener('keydown',unlockAudio,true);

// ---------- Eyre channel ----------
// PUTs are serialized (one in flight, the rest batched) so pokes reach the agent,
// and therefore the other ship, in the order they were made.
const Chan={ship:null,url:null,id:0,es:null,q:[],busy:false,ack:-1,acked:-1,sub:null,wait:new Map(),ackTimer:null,retry:0};
function put(url,actions){return fetch(url,{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(actions)})}
async function connect(){
  if(Chan.es){try{Chan.es.close()}catch(e){}Chan.es=null}
  if(Chan.url)put(Chan.url,[{id:++Chan.id,action:'delete'}]).catch(()=>{});
  for(const res of Chan.wait.values())res('reconnected');
  Chan.wait.clear();
  Chan.url='/~/channel/pong-'+Date.now().toString(36)+'-'+rid(6);
  Chan.id=0;Chan.ack=-1;Chan.acked=-1;Chan.q=[];Chan.busy=false;
  const url=Chan.url;
  try{
    if(!Chan.ship){
      const r=await fetch('/~/host',{credentials:'include'});
      if(!r.ok)throw new Error('host '+r.status);
      Chan.ship=(await r.text()).trim().replace(/^~/,'');
    }
    Chan.sub=++Chan.id;
    const r=await put(url,[{id:Chan.sub,action:'subscribe',ship:Chan.ship,app:'pong',path:'/updates'}]);
    if(!r.ok)throw new Error('channel '+r.status);
  }catch(e){
    if(Chan.url!==url)return;
    S.error='Cannot reach your ship ('+(e.message||e)+').';renderUI();retryConnect();return;
  }
  if(Chan.url!==url)return;
  const es=new EventSource(url,{withCredentials:true});Chan.es=es;
  es.onopen=()=>{Chan.retry=0};
  es.onmessage=onSse;
  es.onerror=()=>{if(Chan.es!==es)return;try{es.close()}catch(x){}Chan.es=null;retryConnect()};
}
function retryConnect(){Chan.retry=Math.min(Chan.retry+1,6);setTimeout(connect,500*Chan.retry)}
function onSse(e){
  const n=parseInt(e.lastEventId,10);
  if(!isNaN(n)&&n>Chan.ack){Chan.ack=n;scheduleAck()}
  let d;try{d=JSON.parse(e.data)}catch(x){return}
  if(d.response==='poke'){const res=Chan.wait.get(d.id);if(res){Chan.wait.delete(d.id);res(d.err?String(d.err):null)}return}
  if(d.id!==Chan.sub)return;
  if(d.response==='subscribe'){if(d.err){S.error='Subscription refused by %pong.';renderUI()}return}
  if(d.response==='diff'){onFact(d.json);return}
  if(d.response==='quit'){Chan.sub=++Chan.id;enqueue({id:Chan.sub,action:'subscribe',ship:Chan.ship,app:'pong',path:'/updates'})}
}
// tag: a later action with the same tag replaces a queued one (paddle positions)
function enqueue(action,tag){
  if(tag){const i=Chan.q.findIndex(x=>x.tag===tag);if(i>=0)Chan.q.splice(i,1)}
  Chan.q.push({action,tag});flush();
}
function flush(){
  if(Chan.busy||!Chan.url||!Chan.ship)return;
  const batch=Chan.q.splice(0).map(x=>x.action);
  if(Chan.ack>Chan.acked){batch.push({id:++Chan.id,action:'ack','event-id':Chan.ack});Chan.acked=Chan.ack}
  if(!batch.length)return;
  Chan.busy=true;const url=Chan.url;
  put(url,batch).catch(()=>{}).finally(()=>{
    if(Chan.url!==url)return;
    Chan.busy=false;
    if(Chan.q.length)flush();else if(Chan.ack>Chan.acked)scheduleAck();
  });
}
function scheduleAck(){if(Chan.ackTimer)return;Chan.ackTimer=setTimeout(()=>{Chan.ackTimer=null;flush()},400)}
// resolves null on ack, or the error text on nack
function poke(json){return new Promise(res=>{const id=++Chan.id;Chan.wait.set(id,res);enqueue({id,action:'poke',ship:Chan.ship,app:'pong',mark:'pong-action',json})})}
function pokeQuiet(json,tag){enqueue({id:++Chan.id,action:'poke',ship:Chan.ship,app:'pong',mark:'pong-action',json},tag)}

// ---------- tables (mirrors the agent) ----------
const S={ready:false,our:null,tables:{},invites:{},notes:{},gone:{},error:null};
const UI={view:'boot',table:null,fromLobby:false,watch:false,err:'',busy:false,toolMsg:'',dropped:null};
function onFact(j){
  if(!j||typeof j!=='object')return;
  if(j.relay){let m=null;try{m=JSON.parse(j.relay.body)}catch(e){}if(m&&typeof m==='object')onRelay(j.relay.gid,j.relay.from,m);return}
  if(j.tables){
    S.our=j.our;S.tables={};S.invites={};
    for(const t of j.tables)S.tables[t.gid]=t;
    for(const i of j.invites||[])S.invites[i.gid]=i.host;
    S.ready=true;S.error=null;follow();
  }
  if(j.table){S.tables[j.table.gid]=j.table;delete S.gone[j.table.gid]}
  if(j.gone){delete S.tables[j.gone];delete S.invites[j.gone];S.gone[j.gone]=true}
  if(j.invite)S.invites[j.invite.gid]=j.invite.host;
  if(j.note)S.notes[j.note.gid]=j.note.text;
  syncSession();renderUI();
}
async function act(json,failText){
  const err=await poke(json);
  if(err){
    console.warn('[pong] poke failed',json,err);
    const why=err==='reconnected'?'connection dropped, try again'
      :String(err).split('\n').map(l=>l.trim()).filter(Boolean).slice(0,3).join(' / ').slice(0,200);
    UI.err=(failText||'Your ship refused that.')+' ('+why+')';renderUI();
  }
  return !err;
}
// Noltbook display names, read from this ship's own %noltbook. A ship without
// Noltbook, or one with no name set, shows as its @p.
const Names={};
function nameOf(ship){
  if(typeof ship!=='string'||!ship)return '';
  const e=Names[ship];
  if(!e||Date.now()-e.at>600000)lookupName(ship);
  return (e&&e.name)||ship;
}
function lookupName(ship){
  const prev=Names[ship];Names[ship]={name:prev?prev.name:null,at:Date.now()};
  fetch('/~/scry/noltbook/api/profile/'+encodeURIComponent(ship)+'.json',{credentials:'include'})
    .then(r=>r.ok?r.json():null)
    .then(j=>{const n=j&&typeof j.displayName==='string'?j.displayName.trim().slice(0,40):'';if(n!==(Names[ship].name||'')){Names[ship].name=n||null;renderUI()}})
    .catch(()=>{});
}
const named=text=>String(text).replace(/~[a-z]{3,6}(?:-[a-z]{6})*/g,s=>nameOf(s));   // notes from the agent
const clip=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
const curT=()=>UI.table&&S.tables[UI.table.gid];
const sideOf=(t,ship)=>!t?null:t.left===ship?LEFT:t.right===ship?RIGHT:null;
function follow(){if(UI.table&&S.ready)pokeQuiet({follow:{gid:UI.table.gid,host:UI.table.host}})}
let lastInput=performance.now(),hbAt=0,refollowAt=0;
for(const ev of ['pointermove','pointerdown','keydown','wheel','touchstart'])addEventListener(ev,()=>{lastInput=performance.now()},{passive:true,capture:true});
function idleLeft(){const t=curT();return t&&sideOf(t,S.our)!=null&&heldHere(t.gid)?IDLE_MS-(performance.now()-lastInput):null}
const idleWarn=left=>'Still there? Your paddle frees in '+Math.max(1,Math.ceil(left/1000))+'s — move your mouse here.';

// ---------- one playing page per ship ----------
// Every page of this ship shares an origin (Noltbook frames and /apps/pong tabs
// alike), so a BroadcastChannel reaches all of them. A seat is played from one
// page at a time: the holder announces itself every 2s, a newcomer defers to it,
// "Play here" takes over, and if the holder closes or goes quiet another page
// showing that table picks it up. Two pages claiming at once: first claim wins.
const PAGE=rid(10),HOLD_BEAT_MS=2000,HOLD_STALE_MS=5000;
const Hold={ch:null,mine:{},other:{},beatAt:0,readyAt:0};
function holdPost(m){if(Hold.ch)try{Hold.ch.postMessage(Object.assign({page:PAGE},m))}catch(e){}}
function holdChanged(){syncSession();renderUI()}
function onHoldMsg(m){
  if(!m||typeof m!=='object'||m.page===PAGE)return;
  if(m.t==='who'){for(const gid of Object.keys(Hold.mine))holdPost({t:'hold',gid,claimAt:Hold.mine[gid]});return}
  const gid=m.gid;if(typeof gid!=='string')return;
  if(m.t==='drop'){if(Hold.other[gid]&&Hold.other[gid].page===m.page){delete Hold.other[gid];holdChanged()}return}
  if(m.t!=='hold'&&m.t!=='take')return;
  const known=Hold.other[gid]&&Hold.other[gid].page===m.page;
  Hold.other[gid]={page:m.page,seen:performance.now()};
  const mine=Hold.mine[gid];
  if(mine!=null){
    const theirs=Number(m.claimAt)||0;
    if(m.t==='take'||theirs<mine||(theirs===mine&&m.page<PAGE)){delete Hold.mine[gid];holdChanged()}
    else holdPost({t:'hold',gid,claimAt:mine});      // we were first: say so
  }else if(!known)renderUI();
}
try{
  if(window.BroadcastChannel){
    Hold.ch=new BroadcastChannel('pong-seat');Hold.ch.onmessage=e=>onHoldMsg(e.data);
    Hold.readyAt=performance.now()+400;holdPost({t:'who'});   // give a current holder time to answer
    setTimeout(holdChanged,450);
  }
}catch(e){Hold.ch=null}
addEventListener('pagehide',()=>{for(const gid of Object.keys(Hold.mine))holdPost({t:'drop',gid})});
const heldHere=gid=>!Hold.ch||Hold.mine[gid]!=null;
function heldElsewhere(gid){
  const o=!heldHere(gid)&&Hold.other[gid];
  return !!o&&performance.now()-o.seen<HOLD_STALE_MS;
}
// claim the seat for this page unless another page is playing it
function canPlay(gid){
  if(heldHere(gid))return true;
  if(performance.now()<Hold.readyAt||heldElsewhere(gid))return false;
  Hold.mine[gid]=Date.now();holdPost({t:'hold',gid,claimAt:Hold.mine[gid]});
  return true;
}
function playHere(gid){Hold.mine[gid]=Date.now();delete Hold.other[gid];holdPost({t:'take',gid});holdChanged()}
function holdTick(now){
  // let go of seats we no longer sit in or no longer show; announce the rest
  for(const gid of Object.keys(Hold.mine)){
    const t=S.tables[gid];
    if(!t||sideOf(t,S.our)==null||!UI.table||UI.table.gid!==gid){delete Hold.mine[gid];holdPost({t:'drop',gid})}
  }
  if(now-Hold.beatAt>=HOLD_BEAT_MS){Hold.beatAt=now;for(const gid of Object.keys(Hold.mine))holdPost({t:'hold',gid,claimAt:Hold.mine[gid]})}
}

setInterval(()=>{
  holdTick(performance.now());
  if(!S.ready||!UI.table)return;
  const now=performance.now(),t=curT();
  if(!t){
    // closed under an older version, the host can't tell us it reopened: look again now and then
    if(S.gone[UI.table.gid]&&UI.table.host!==S.our&&now-refollowAt>30000){refollowAt=now;follow()}
    return;
  }
  if(sideOf(t,S.our)==null)return;
  // another page plays this seat: no idle clock, no heartbeat from here
  const had=heldHere(t.gid);
  if(!canPlay(t.gid))return;
  if(!had)holdChanged();
  const left=IDLE_MS-(now-lastInput);
  if(left<=0){
    lastInput=now;
    S.notes[t.gid]='You were idle for '+Math.round(IDLE_MS/60000)+' minutes, so your paddle was freed.';
    standUp();renderUI();return;
  }
  if(left<IDLE_WARN_MS)renderUI();                   // the card shows the countdown
  if(now-hbAt>=HEARTBEAT_MS){hbAt=now;pokeQuiet({here:{gid:t.gid,host:t.host}})}
},1000);
function sit(side){
  const t=UI.table;UI.err='';delete S.notes[t.gid];
  act({sit:{gid:t.gid,host:t.host,side:side===LEFT?'l':'r'}},'Could not take that paddle.');renderUI();
}
function standUp(){const t=UI.table;UI.watch=false;act({stand:{gid:t.gid,host:t.host}})}
function reportScore(){
  if(Net&&Net.role==='player')pokeQuiet({score:{gid:Net.gid,host:UI.table.host,l:G.score[0],r:G.score[1]}});
}
function openTable(gid,host){UI.table={gid,host};UI.fromLobby=true;UI.watch=false;UI.err='';follow();syncSession();renderUI()}
function backToLobby(){UI.table=null;UI.watch=false;UI.err='';syncSession();renderUI()}

// ---------- sessions: playing or watching the open table ----------
let Net=null,G=null;
const isCpu=()=>!!G&&G.mode==='cpu';
function wantSession(){
  if(isCpu()||!UI.table||!S.ready)return null;
  const t=curT();if(!t||!t.left||!t.right)return null;
  const me=sideOf(t,S.our),key=t.gid+':'+t.left+':'+t.right;
  if(me!=null)return canPlay(t.gid)?{role:'player',gid:t.gid,me,them:me===LEFT?t.right:t.left,key:'p:'+key}:null;
  if(UI.watch)return{role:'watch',gid:t.gid,players:[t.left,t.right],key:'w:'+key};
  return null;
}
function syncSession(){
  const w=wantSession();
  if(Net&&(!w||w.key!==Net.key))endSession();
  if(w&&!Net)(w.role==='player'?startPlayer:startWatch)(w);
}
function endSession(){
  if(!Net)return;
  if(Net.rtc)rtcClose(Net.rtc,true);
  if(Net.watchers)for(const r of Net.watchers.values())rtcClose(r,true);
  Net=null;if(G&&G.mode!=='cpu')G=null;
}
function relayTo(ship,m,tag){if(Net)pokeQuiet({relay:{gid:Net.gid,to:ship,body:JSON.stringify(m)}},tag?Net.gid+':'+ship+':'+tag:null)}
const lat=()=>Net?Math.min(250,Math.max(0,Net.rtt/2))/1000:0;
function onRelay(gid,from,m){
  if(!Net||Net.gid!==gid)return;
  if(Net.role==='watch'){if(m.t==='rtc'&&m.to===Net.sid)onWatchSignal(from,m);return}
  if(m.t==='rtc'){
    if(m.w)onWatcherSignal(from,m);
    else if(from===Net.them)onPlayerSignal(m);
    return;
  }
  if(from===Net.them)onPeer(m);
}

// ---------- WebRTC ----------
function rtcOpen(o){
  const r={ship:o.ship,peerSid:o.peerSid||null,watch:!!o.watch,pc:null,dc:null,open:false,closed:false,sent:false,out:[],ice:[],o};
  try{r.pc=new RTCPeerConnection({iceServers:ICE})}catch(e){r.closed=true;return r}
  const pc=r.pc;
  pc.onicecandidate=e=>{if(e.candidate)rtcSig(r,{k:'ice',c:e.candidate.toJSON()})};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')rtcClose(r)};
  if(o.offer){
    rtcBind(r,pc.createDataChannel('pong'));
    pc.createOffer().then(d=>pc.setLocalDescription(d)).then(()=>rtcSig(r,{k:'offer',sdp:pc.localDescription.sdp})).catch(()=>rtcClose(r));
  }else pc.ondatachannel=e=>rtcBind(r,e.channel);
  return r;
}
function rtcBind(r,dc){
  r.dc=dc;
  dc.onopen=()=>{if(r.closed)return;r.open=true;if(r.o.onopen)r.o.onopen(r)};
  dc.onclose=()=>rtcClose(r);
  dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m&&typeof m==='object'&&!r.closed)r.o.onmsg(m,r)};
}
// candidates wait until our offer/answer has gone out, or they'd reach a peer
// that has no connection to add them to yet
function rtcSig(r,s){
  if(r.closed||!Net)return;
  if(s.k==='ice'&&!r.sent){r.out.push(s);return}
  relayTo(r.ship,Object.assign({t:'rtc',w:r.watch?1:0,from:Net.sid,to:r.peerSid},s));
  if(s.k!=='ice'){r.sent=true;for(const x of r.out.splice(0))rtcSig(r,x)}
}
async function rtcIncoming(r,s){
  const pc=r.pc;if(!pc||r.closed)return;
  try{
    if(s.k==='offer'){
      await pc.setRemoteDescription({type:'offer',sdp:s.sdp});
      await pc.setLocalDescription(await pc.createAnswer());
      rtcSig(r,{k:'answer',sdp:pc.localDescription.sdp});
      for(const c of r.ice.splice(0))await pc.addIceCandidate(c);
    }else if(s.k==='answer'){
      if(pc.signalingState!=='have-local-offer')return;
      await pc.setRemoteDescription({type:'answer',sdp:s.sdp});
      for(const c of r.ice.splice(0))await pc.addIceCandidate(c);
    }else if(s.k==='ice'&&s.c){
      if(pc.remoteDescription)await pc.addIceCandidate(s.c);else r.ice.push(s.c);
    }
  }catch(e){console.warn('[pong] webrtc',e);rtcClose(r)}
}
function rtcSend(r,m){
  if(!r||!r.open||!r.dc||r.dc.readyState!=='open')return false;
  try{r.dc.send(JSON.stringify(m));return true}catch(e){return false}
}
function rtcClose(r,quiet){
  if(!r||r.closed)return;
  r.closed=true;const was=r.open;r.open=false;
  try{if(r.dc)r.dc.close()}catch(e){}
  try{if(r.pc)r.pc.close()}catch(e){}
  if(!quiet&&r.o.onclose)r.o.onclose(r,was);
}

// ---------- player session ----------
function startPlayer(w){
  Net={key:w.key,role:'player',gid:w.gid,me:w.me,lead:w.me===LEFT,them:w.them,sid:rid(10),
    peer:null,heard:false,linked:false,rtt:150,lastRx:0,lastPy:null,lastPAt:0,hiAt:0,pingAt:0,
    rtc:null,rtcSince:0,startAt:0,watchers:new Map(),wAt:0};
  G=newGame('net',w.me);
  unlockAudio();sendHi();
}
function sendHi(){Net.hiAt=performance.now();relayTo(Net.them,{t:'hi',sid:Net.sid,seen:Net.peer})}
// Handshake: linked once we know the other page's id AND it has echoed ours.
// A new id from the other side means it reloaded: start over together.
function onHi(m){
  if(typeof m.sid!=='string')return;
  if(m.sid!==Net.peer){
    Net.peer=m.sid;Net.heard=false;Net.linked=false;Net.startAt=0;
    if(Net.rtc){rtcClose(Net.rtc,true);Net.rtc=null}
    G=newGame('net',Net.me);
    sendHi();
    if(Net.lead)playerRtc(true);
  }else if(m.seen!==Net.sid&&Net.linked)sendHi();
  if(m.seen===Net.sid)Net.heard=true;
  if(!Net.linked&&Net.peer&&Net.heard){
    Net.linked=true;Net.lastRx=performance.now();Net.pingAt=0;
    Net.startAt=performance.now()+(Net.rtc?RTC_WAIT:0);
  }
}
function playerRtc(offer){
  Net.rtcSince=performance.now();
  Net.rtc=rtcOpen({ship:Net.them,peerSid:Net.peer,offer,
    onmsg:m=>onPeer(m),
    onclose:r=>{if(Net&&Net.rtc===r){Net.rtc=null;rtcLost()}}});
}
function onPlayerSignal(m){
  if(m.to!==Net.sid||m.from!==Net.peer)return;
  if(m.k==='offer'&&!Net.lead){if(Net.rtc)rtcClose(Net.rtc,true);playerRtc(false)}
  if(Net.rtc)rtcIncoming(Net.rtc,m);
}
// match messages take the path the match started on
function sendPeer(m,tag){
  if(!Net)return;
  if(G&&G.via==='rtc'){if(rtcSend(Net.rtc,m))return;rtcLost()}
  relayTo(Net.them,m,tag);
}
function rtcLost(){
  if(!G||G.via!=='rtc')return;
  G.via='relay';
  // anything in flight on the dead channel is gone; the lead restates the match
  if(Net&&Net.lead&&G.m)relayTo(Net.them,Object.assign({t:'sync'},snapshot()));
}
function emit(m){sendPeer(m);fanOut(m,0)}                  // an event we author
function hostStart(){
  const m=1+Math.floor(Math.random()*1e9),via=Net.rtc&&Net.rtc.open?'rtc':'relay',go={t:'go',m,via};
  if(via==='rtc')rtcSend(Net.rtc,go);else relayTo(Net.them,go);
  startMatch(m,via);fanOut({t:'go',m},0);reportScore();
}
function onPeer(m){
  if(!G||!Net)return;
  const now=performance.now();Net.lastRx=now;
  switch(m.t){
    case 'hi':onHi(m);break;
    case 'ping':sendPeer({t:'pong',ts:m.ts});break;
    case 'pong':{const s=now-Number(m.ts);if(s>=0&&s<5000)Net.rtt=Net.rtt*0.7+s*0.3;break}
    case 'p':if(Number.isFinite(m.y))G.pad[1-G.me]=clampPad(m.y);break;
    case 'go':if(!Net.lead&&Number.isFinite(m.m)){Net.linked=true;startMatch(m.m,m.via==='rtc'?'rtc':'relay');fanOut({t:'go',m:m.m},lat())}break;
    case 'b':if(m.m===G.m&&adoptBall(m,lat()))fanOut(m,lat());break;
    case 'pt':if(m.m===G.m&&adoptPoint(m))fanOut(m,lat());break;
    case 'again':if(m.m===G.m){G.peerAgain=true;maybeRematch()}break;
    case 'sync':if(!Net.lead&&m.m===G.m){G.via='relay';adoptSnap(m,lat())}break;
  }
}
// watchers ask any player; each player serves its own
function onWatcherSignal(from,m){
  if(!G||typeof m.from!=='string')return;
  let r=Net.watchers.get(m.from);
  if(!r&&m.k==='offer'){
    if(Net.watchers.size>=MAX_WATCHERS)return;
    r=rtcOpen({ship:from,peerSid:m.from,offer:false,watch:true,
      onopen:r=>rtcSend(r,Object.assign({t:'snap'},snapshot())),
      onmsg:(x,r)=>{if(x.t==='ping')rtcSend(r,{t:'pong',ts:x.ts})},
      onclose:r=>{if(Net&&Net.watchers)Net.watchers.delete(r.peerSid)}});
    Net.watchers.set(m.from,r);
  }
  if(r&&r.ship===from)rtcIncoming(r,m);
}
function fanOut(m,age){
  if(!Net||!Net.watchers||!Net.watchers.size)return;
  const x=Object.assign({},m,{age:Math.round(age*1000)});
  for(const r of Net.watchers.values())rtcSend(r,x);
}
function snapshot(){
  const b=G.ball;
  return{m:G.m,k:G.k,phase:G.phase,s:G.score.slice(),pads:[G.pad[0],G.pad[1]],
    count:Math.max(0,Math.round(G.countEnd-performance.now())),serveBy:G.serveBy,
    ball:{x:b.x,y:b.y,vx:b.vx,vy:b.vy,live:b.live&&!b.frozen}};
}
function adoptSnap(m,ff){
  if(!Number.isFinite(m.m))return;
  const b=G.ball,now=performance.now();
  G.m=m.m;G.k=m.k|0;G.score=[m.s[0]|0,m.s[1]|0];G.phase=m.phase;G.serveBy=m.serveBy;
  G.countEnd=now+(m.count|0)-ff*1000;G.serveAt=now+SERVE_MS;
  if(Array.isArray(m.pads)&&G.mode==='watch'){G.pad=[clampPad(+m.pads[0]||H/2),clampPad(+m.pads[1]||H/2)];G.show=G.pad.slice()}
  const s=m.ball||{};
  if(s.live&&[s.x,s.y,s.vx,s.vy].every(Number.isFinite)){
    b.x=s.x;b.y=s.y;b.vx=s.vx;b.vy=s.vy;b.live=true;b.spec=false;b.frozen=false;fastForward(ff);
  }else b.live=false;
  G.corr={x:0,y:0};
}

// ---------- watcher session ----------
function startWatch(w){
  Net={key:w.key,role:'watch',gid:w.gid,players:w.players,tries:0,sid:rid(10),
    rtc:null,rtcSince:0,rtt:150,lastRx:0,linked:false,pingAt:0};
  G=newGame('watch',LEFT);
  watchTry();
}
function watchTry(){
  const ship=Net.players[Net.tries++%2];
  if(Net.rtc)rtcClose(Net.rtc,true);
  Net.linked=false;Net.rtcSince=performance.now();
  Net.rtc=rtcOpen({ship,offer:true,watch:true,
    onopen:()=>{Net.linked=true;Net.lastRx=performance.now();Net.pingAt=0},
    onmsg:m=>onWatchMsg(m),
    onclose:r=>{if(Net&&Net.rtc===r){Net.rtc=null;Net.linked=false;Net.rtcSince=0}}});
}
function onWatchSignal(from,m){
  const r=Net.rtc;if(!r||r.ship!==from)return;
  if(!r.peerSid&&m.k==='answer')r.peerSid=m.from;
  if(m.from===r.peerSid)rtcIncoming(r,m);
}
function onWatchMsg(m){
  const now=performance.now(),ff=(Number(m.age)||0)/1000+lat();Net.lastRx=now;
  switch(m.t){
    case 'snap':G=newGame('watch',LEFT);adoptSnap(m,ff);break;
    case 'w':if(m.m===G.m&&Array.isArray(m.pads)){G.pad[0]=clampPad(+m.pads[0]||H/2);G.pad[1]=clampPad(+m.pads[1]||H/2)}break;
    case 'go':if(Number.isFinite(m.m)){startMatch(m.m,'rtc');G.countEnd-=ff*1000}break;
    case 'b':if(m.m===G.m)adoptBall(m,ff);break;
    case 'pt':if(m.m===G.m)adoptPoint(m);break;
    case 'pong':{const s=now-Number(m.ts);if(s>=0&&s<5000)Net.rtt=Net.rtt*0.7+s*0.3;break}
  }
}

function netTick(now){
  if(!Net)return;
  if(Net.role==='watch'){
    if(!Net.linked&&now-Net.rtcSince>WATCH_TRY_MS)watchTry();
    if(Net.linked&&now-Net.pingAt>PING_MS){Net.pingAt=now;rtcSend(Net.rtc,{t:'ping',ts:now})}
    return;
  }
  if(!Net.linked&&now-Net.hiAt>HI_MS)sendHi();
  if(Net.rtc&&!Net.rtc.open&&now-Net.rtcSince>RTC_TIMEOUT)rtcClose(Net.rtc);
  if(!Net.linked)return;
  if(Net.lead&&!G.m&&Net.startAt&&(now>=Net.startAt||(Net.rtc&&Net.rtc.open)))hostStart();
  if(!G.m)return;
  if(now-Net.pingAt>PING_MS){Net.pingAt=now;sendPeer({t:'ping',ts:now})}
  const y=Math.round(G.pad[G.me]*10)/10,gap=G.via==='rtc'?PADDLE_RTC_MS:PADDLE_RELAY_MS;
  if(y!==Net.lastPy&&now-Net.lastPAt>=gap){Net.lastPy=y;Net.lastPAt=now;sendPeer({t:'p',y},'p')}
  if(Net.watchers.size&&now-Net.wAt>=WATCH_MS){Net.wAt=now;fanOut({t:'w',m:G.m,pads:[Math.round(G.pad[0]),Math.round(G.pad[1])]},0)}
}

// ---------- match ----------
function newGame(mode,me){
  return{mode,me,m:0,via:null,pad:[H/2,H/2],show:[H/2,H/2],score:[0,0],
    ball:{x:W/2-BALL/2,y:H/2-BALL/2,vx:0,vy:0,live:false,spec:false,frozen:false},
    k:0,phase:'wait',countEnd:0,serveAt:0,serveBy:null,serveDir:0,
    corr:{x:0,y:0},predHit:false,wantAgain:false,peerAgain:false,
    cpuK:-1,cpuV:0,cpuReact:0,cpuErr:0,cpuAim:0,acc:0};
}
const mine=side=>G.mode==='cpu'||(G.mode==='net'&&side===G.me);
function startMatch(m,via){
  const keep=G.pad.slice();
  G=newGame(G.mode,G.me);G.pad=keep;G.show=keep.slice();G.m=m;G.via=via||null;
  const now=performance.now();
  G.phase='count';
  G.countEnd=now+COUNT_MS-(Net&&Net.role==='player'&&!Net.lead?lat()*1000:0);
  G.serveBy=LEFT;G.serveAt=now+COUNT_MS;          // the left paddle serves first
  unlockAudio();
}
function serve(){
  const b=G.ball,dir=G.serveDir||(Math.random()<0.5?-1:1),a=(Math.random()*2-1)*0.45;
  b.x=W/2-BALL/2;b.y=H/2-BALL/2+(Math.random()*2-1)*H*0.25;
  b.vx=dir*SPEED0*Math.cos(a);b.vy=SPEED0*Math.sin(a);
  b.live=true;b.spec=false;b.frozen=false;G.corr={x:0,y:0};G.predHit=false;
  G.k++;G.phase='play';G.serveBy=null;
  emit({t:'b',m:G.m,k:G.k,x:b.x,y:b.y,vx:b.vx,vy:b.vy,e:'serve'});
}
function simStep(dt){
  const b=G.ball;if(!b.live||b.frozen)return;
  const px=b.x;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y<0){b.y=-b.y;b.vy=Math.abs(b.vy);sfx.wall()}
  else if(b.y>H-BALL){b.y=2*(H-BALL)-b.y;b.vy=-Math.abs(b.vy);sfx.wall()}
  if(b.vx<0&&px>=LFACE&&b.x<LFACE)cross(LEFT);
  else if(b.vx>0&&px+BALL<=RFACE&&b.x+BALL>RFACE)cross(RIGHT);
  if(b.x+BALL<0)goal(LEFT);else if(b.x>W)goal(RIGHT);
}
function cross(side){
  const b=G.ball,py=G.pad[side];
  const hit=b.y+BALL>=py-PH/2&&b.y<=py+PH/2;
  if(mine(side)&&!b.spec){
    if(!hit)return;                                 // a miss is settled at the goal line
    bounce(side);G.k++;sfx.paddle();
    emit({t:'b',m:G.m,k:G.k,x:b.x,y:b.y,vx:b.vx,vy:b.vy,e:'hit'});
  }else{
    // not ours to call: guess from their last known paddle, the owner corrects us
    b.spec=true;
    if(hit){bounce(side);sfx.paddle();G.predHit=true}
  }
}
function bounce(side){
  const b=G.ball,py=G.pad[side];
  const rel=Math.max(-1,Math.min(1,((b.y+BALL/2)-py)/(PH/2+BALL/2)));
  const sp=Math.min(SPEEDMAX,Math.hypot(b.vx,b.vy)*SPEEDUP),a=rel*MAXANG;
  b.vx=(side===LEFT?1:-1)*sp*Math.cos(a);b.vy=sp*Math.sin(a);
  b.x=side===LEFT?LFACE:RFACE-BALL;
}
function goal(side){
  if(mine(side)&&!G.ball.spec){concede(side);return}
  G.ball.frozen=true;                               // hold until the owner rules
}
function concede(side){
  G.ball.live=false;G.score[1-side]++;G.k++;sfx.score();
  emit({t:'pt',m:G.m,k:G.k,s:G.score.slice(),c:side});
  afterPoint(side);reportScore();
}
function afterPoint(conceder){
  G.predHit=false;
  if(G.score[0]>=WIN||G.score[1]>=WIN){G.phase='over';G.serveBy=null;return}
  G.phase='point';G.serveBy=conceder;G.serveDir=conceder===LEFT?-1:1;G.serveAt=performance.now()+SERVE_MS;
}
function fastForward(sec){
  const b=G.ball;
  for(let t=sec;t>0;t-=STEP){
    const dt=Math.min(STEP,t);b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<0){b.y=-b.y;b.vy=Math.abs(b.vy)}else if(b.y>H-BALL){b.y=2*(H-BALL)-b.y;b.vy=-Math.abs(b.vy)}
  }
}
function adoptBall(m,ff){
  if(!(m.k>G.k)||![m.x,m.y,m.vx,m.vy].every(Number.isFinite))return false;
  const b=G.ball,was=(b.live&&!b.frozen)?{x:b.x,y:b.y}:null;
  G.k=m.k;
  b.x=m.x;b.y=m.y;b.vx=m.vx;b.vy=m.vy;b.live=true;b.spec=false;b.frozen=false;
  fastForward(Math.min(0.5,ff));
  // small corrections glide; big ones (a wrong guess) snap
  if(was&&Math.hypot(was.x-b.x,was.y-b.y)<80){G.corr.x+=was.x-b.x;G.corr.y+=was.y-b.y}else G.corr={x:0,y:0};
  if(m.e==='hit'&&!G.predHit)sfx.paddle();
  G.predHit=false;G.phase='play';G.serveBy=null;
  return true;
}
function adoptPoint(m){
  if(!(m.k>G.k)||!Array.isArray(m.s)||m.s.length!==2)return false;
  G.k=m.k;G.score=[m.s[0]|0,m.s[1]|0];G.ball.live=false;G.corr={x:0,y:0};sfx.score();
  afterPoint(m.c===LEFT||m.c===RIGHT?m.c:1-G.me);
  return true;
}
function askRematch(){
  if(isCpu()){startMatch(0);renderUI();return}
  G.wantAgain=true;sendPeer({t:'again',m:G.m});maybeRematch();
}
function maybeRematch(){if(Net&&Net.lead&&G.phase==='over'&&G.wantAgain&&G.peerAgain)hostStart()}
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
// where (centre y) and when the ball reaches the CPU's paddle face, walls folded in
function cpuPredict(b){
  const t=(RFACE-(b.x+BALL))/b.vx;if(t<0)return{y:b.y+BALL/2,t:0};
  const span=H-BALL,P=2*span;let y=(b.y+b.vy*t)%P;if(y<0)y+=P;if(y>span)y=P-y;
  return{y:y+BALL/2,t};
}
function cpuTick(dt,now){
  const b=G.ball;let target=H/2,urgent=false;
  if(b.live&&!b.frozen&&b.vx>0){
    if(G.cpuK!==G.k){                               // a new shot is coming: read it, then plan
      G.cpuK=G.k;
      G.cpuReact=now+1000*(CPU_REACT[0]+Math.random()*(CPU_REACT[1]-CPU_REACT[0]));
      G.cpuErr=gauss()*Math.hypot(b.vx,b.vy)*CPU_ERR*(Math.random()<CPU_WHIFF?3:1);
      G.cpuAim=(G.pad[LEFT]<H/2?1:-1)*(CPU_AIM[0]+Math.random()*(CPU_AIM[1]-CPU_AIM[0]));
    }
    if(now>=G.cpuReact){
      const p=cpuPredict(b),near=Math.max(CPU_FLOOR,Math.min(1,p.t/0.9));   // the guess firms up as it closes in
      target=p.y+G.cpuErr*near-G.cpuAim*(PH/2+BALL/2);urgent=true;
    }else target=G.pad[RIGHT];                     // still reading the shot
  }
  const cur=G.pad[RIGHT],want=Math.max(-CPU_SPEED,Math.min(CPU_SPEED,(target-cur)*(urgent?9:3)));
  const mdv=CPU_ACCEL*dt;G.cpuV+=Math.max(-mdv,Math.min(mdv,want-G.cpuV));
  G.pad[RIGHT]=clampPad(cur+G.cpuV*dt);
  if(G.pad[RIGHT]===PH/2||G.pad[RIGHT]===H-PH/2)G.cpuV=0;
}
// practice runs in place: from a table it plays over the table view, and quitting
// returns to it (the table keeps updating meanwhile)
function startCpu(){
  endSession();UI.watch=false;
  G=newGame('cpu',LEFT);startMatch(0);renderUI();
}
function quitCpu(){G=null;syncSession();renderUI()}

// ---------- input ----------
let pointerY=null;
function onPointer(e){const r=cv.getBoundingClientRect();if(r.height>0)pointerY=(e.clientY-r.top)/r.height*VH-WT}
addEventListener('pointermove',onPointer,{passive:true});
addEventListener('pointerdown',onPointer,{passive:true});

// ---------- drawing ----------
const cv=$('field'),ctx=cv.getContext('2d');
const DIG=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001',
           '111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];
function fitCanvas(){
  const r=$('stage').getBoundingClientRect();
  const ar=W/VH;
  let w=Math.max(100,r.width-16),h=w/ar;
  if(h>r.height-16){h=Math.max(62,r.height-16);w=h*ar}
  cv.style.width=Math.floor(w)+'px';cv.style.height=Math.floor(h)+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
}
function drawScore(n,x,y,alignRight){
  const str=String(n),cell=8,dw=3*cell,gap=cell,tw=str.length*dw+(str.length-1)*gap;
  let sx=alignRight?x-tw:x;
  for(const ch of str){
    const bits=DIG[+ch];
    for(let i=0;i<15;i++)if(bits[i]==='1')ctx.fillRect(sx+(i%3)*cell,y+Math.floor(i/3)*cell,cell,cell);
    sx+=dw+gap;
  }
}
const IDLE=newGame('idle',LEFT);
function seatNames(){
  if(isCpu())return['you','cpu'];
  const t=curT();if(!t)return null;
  const n=s=>!s?'':s===S.our?'you':clip(nameOf(s),20);
  return[n(t.left),n(t.right)];
}
function draw(){
  const s=cv.width/W,g=G||IDLE,b=g.ball,t=!G&&curT();
  ctx.setTransform(s,0,0,s,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,VH);
  ctx.fillStyle='#bdbdbd';ctx.fillRect(0,0,W,WT);ctx.fillRect(0,VH-WT,W,WT);   // top and bottom walls
  ctx.translate(0,WT);
  ctx.fillStyle='#555';for(let y=6;y<H;y+=26)ctx.fillRect(W/2-2,y,4,14);
  ctx.fillStyle='#f2f2f2';
  const sc=t?t.score:g.score;
  drawScore(sc[0],W/2-44,24,true);drawScore(sc[1],W/2+44,24,false);
  ctx.fillRect(PX,Math.round(g.show[0]-PH/2),PW,PH);
  ctx.fillRect(W-PX-PW,Math.round(g.show[1]-PH/2),PW,PH);
  if(b.live&&!b.frozen)ctx.fillRect(Math.round(b.x+g.corr.x),Math.round(b.y+g.corr.y),BALL,BALL);
  const names=seatNames();
  if(names){
    ctx.font='13px ui-monospace,Menlo,monospace';ctx.textBaseline='bottom';
    ctx.fillStyle=names[0]==='you'?'#cfcfcf':'#6a6a6a';ctx.textAlign='left';ctx.fillText(names[0],PX,H-8);
    ctx.fillStyle=names[1]==='you'?'#cfcfcf':'#6a6a6a';ctx.textAlign='right';ctx.fillText(names[1],W-PX,H-8);
  }
}

// ---------- overlays ----------
function msgState(now){
  if(!G)return null;
  const il=G.mode==='net'?idleLeft():null;
  if(il!=null&&il<IDLE_WARN_MS)return{key:'idle'+Math.ceil(il/1000),text:idleWarn(il)};
  const watch=G.mode==='watch',names=seatNames()||['',''];
  const them=isCpu()?'CPU':Net&&Net.role==='player'?nameOf(Net.them):'';
  if(watch&&!Net.linked)return{key:'wconn',text:'Connecting to the game…'};
  if(G.mode==='net'&&!Net.linked)return{key:'wait',text:'Waiting for '+them+' to open the game…'};
  if(G.mode==='net'&&!G.m)return{key:'conn',text:'Connecting…'};
  if(G.phase==='count'&&now<G.countEnd){const n=Math.max(1,Math.ceil((G.countEnd-now)/1000));return{key:'c'+n,big:String(n)}}
  if(G.phase==='over'){
    if(watch){
      const w=G.score[0]>G.score[1]?0:1;
      return{key:'over-w',big:(names[w]==='you'?'YOU':names[w]||'?')+' WINS',text:G.score[w]+' – '+G.score[1-w]};
    }
    const won=G.score[G.me]>G.score[1-G.me],sc=G.score[G.me]+' – '+G.score[1-G.me];
    const big=won?'YOU WIN':isCpu()?'CPU WINS':'YOU LOSE';
    if(isCpu())return{key:'over-cpu',big,text:sc,btns:[['Play again',askRematch],['Quit',quitCpu,'ghost']]};
    const text=G.wantAgain?'Waiting for '+them+'…':G.peerAgain?them+' wants a rematch':sc;
    return{key:'over-'+G.wantAgain+G.peerAgain,big,text,btns:[['Rematch',askRematch,'',G.wantAgain],['Stand up',standUp,'ghost']]};
  }
  if(Net&&now-Net.lastRx>STALL_MS)return{key:'stall',text:watch?'The game feed stalled…':'Lost contact with '+them+'…'};
  return null;
}
let msgKey='';
function updateMsg(now){
  const st=$('panel').hidden?msgState(now):null,key=st?st.key:'';
  cv.style.cursor=(G&&G.mode!=='watch'&&!st&&$('panel').hidden)?'none':'default';
  if(key===msgKey)return;msgKey=key;
  const box=$('msg');box.textContent='';
  if(!st){box.hidden=true;return}
  if(st.big)box.append(el('div','big',st.big));
  if(st.text)box.append(el('div','sub',st.text));
  if(st.btns){const r=el('div','row');for(const [label,fn,cls,off] of st.btns){const b=button(label,fn,cls);b.disabled=!!off;r.append(b)}box.append(r)}
  box.hidden=false;
}
function statusText(){
  if(!S.ready)return S.error?'offline':'connecting…';
  if(isCpu())return 'practice vs CPU';
  if(Net&&Net.role==='player'){
    const path=!G.m?'':G.via==='rtc'?' · direct':' · via ships';
    return (Net.me===LEFT?'left':'right')+' paddle vs '+nameOf(Net.them)+(Net.linked?' · '+Math.round(Net.rtt)+' ms'+path:'');
  }
  if(Net&&Net.role==='watch')return 'watching'+(Net.linked?' · '+Math.round(Net.rtt)+' ms':'');
  if(UI.table)return UI.table.host===S.our?'your table':nameOf(UI.table.host)+'’s table';
  return S.our?nameOf(S.our):'';
}

// ---------- panels ----------
const shipInput=el('input');shipInput.placeholder='~sampel-palnet';shipInput.spellcheck=false;shipInput.autocomplete='off';
shipInput.addEventListener('keydown',e=>{if(e.key==='Enter')challenge()});
async function challenge(){
  let v=shipInput.value.trim().toLowerCase();if(v&&v[0]!=='~')v='~'+v;
  if(!SHIP_RE.test(v)){UI.err='Enter a ship, like ~sampel-palnet.';renderUI();return}
  if(v===S.our){UI.err='That’s you.';renderUI();return}
  const gid=rid(10);UI.err='';
  if(await act({challenge:{gid,who:v}},'Challenge failed.')){shipInput.value='';openTable(gid,S.our)}
}
function tableLabel(t){
  const who=[t.left,t.right].map(s=>!s?s:s===S.our?'you':nameOf(s));
  const seats=t.left&&t.right?who[0]+' vs '+who[1]:(who[0]||who[1]||'nobody')+' seated';
  return (t.host===S.our?'Your table':nameOf(t.host)+'’s table')+' — '+seats;
}
function lobbyCard(){
  const c=el('div','card'),row=el('div','row');
  c.append(el('h2',null,'CHALLENGE A SHIP'));
  const slot=el('span');slot.dataset.slot='ship';     // the live input is moved in after placement
  row.append(slot,button('Challenge',challenge));c.append(row);
  if(UI.err)c.append(el('div','err',UI.err));
  const inv=Object.entries(S.invites);
  if(inv.length){
    const list=el('div','list');
    for(const [gid,host] of inv){
      const it=el('div','item'),who=el('div','who',nameOf(host)+' challenges you');who.title=host;
      it.append(who,button('Play',()=>{openTable(gid,host);sit(RIGHT)}),button('Decline',()=>act({dismiss:{gid}}),'ghost'));
      list.append(it);
    }
    c.append(el('h2',null,'CHALLENGES'),list);
  }
  const mine=Object.values(S.tables).filter(t=>(t.host===S.our||sideOf(t,S.our)!=null)&&!S.invites[t.gid]).sort((a,b)=>b.created-a.created);
  if(mine.length){
    const list=el('div','list');
    for(const t of mine){
      const it=el('div','item'),who=el('div','who',tableLabel(t));who.title=who.textContent;
      it.append(who,button('Open',()=>openTable(t.gid,t.host)),
        t.host===S.our?button('Close',()=>act({close:{gid:t.gid}}),'ghost'):button('Forget',()=>forget(t),'ghost'));
      list.append(it);
    }
    c.append(el('h2',null,'TABLES'),list);
  }
  c.append(el('h2',null,'PRACTICE'),button('Play vs CPU',startCpu));
  return c;
}
function forget(t){if(sideOf(t,S.our)!=null)act({stand:{gid:t.gid,host:t.host}});act({dismiss:{gid:t.gid}})}
function seatRow(t,side){
  const who=side===LEFT?t.left:t.right,me=sideOf(t,S.our),row=el('div','item');
  row.append(el('span','lbl',side===LEFT?'Left paddle':'Right paddle'));
  let text=who?(who===S.our?'you':nameOf(who)):'open';
  const held=side===RIGHT&&!who&&t.invite&&t.invite!==S.our;
  if(held)text='saved for '+nameOf(t.invite);
  const w=el('span','who'+(who?'':' dim'),text);w.title=who||(held?t.invite:text);row.append(w);
  if(!who&&me==null&&!held)row.append(button('Pick up',()=>sit(side)));
  return row;
}
function tableCard(){
  const g=UI.table,t=curT(),c=el('div','card'),note=S.notes[g.gid];
  c.append(el('h2',null,'PONG TABLE'));
  if(!t){
    if(!S.gone[g.gid])c.append(para('Looking for '+(g.host===S.our?'your':nameOf(g.host)+'’s')+' table…','dim'));
    else if(g.host===S.our)c.append(para('This table is closed.'),button('Reopen table',()=>act({host:{gid:g.gid}},'Could not reopen.')));
    else c.append(para('This table is closed.'));
  }else{
    const me=sideOf(t,S.our);
    c.append(para((t.host===S.our?'Your table.':nameOf(t.host)+' is hosting.')+' First to 11. Anyone here can take an open paddle.','dim'));
    c.append(seatRow(t,LEFT),seatRow(t,RIGHT));
    if(me==null){const r=el('div','row end');r.append(button('Play vs CPU',startCpu));c.append(r)}
    if(t.left&&t.right)c.append(para('Score '+t.score[0]+' – '+t.score[1]));
    const acts=el('div','row');
    const away=me!=null&&heldElsewhere(g.gid);
    if(away)c.append(para('You’re playing this table in another tab or window.','dim'));
    if(away)acts.append(button('Play here',()=>playHere(g.gid)));
    if(me!=null)acts.append(button('Stand up',standUp,'ghost'));
    if(me==null&&t.left&&t.right)acts.append(button('Watch live',()=>{UI.watch=true;syncSession();renderUI()}));
    if(t.host===S.our)acts.append(button('Close table',()=>act({close:{gid:g.gid}}),'ghost'));
    if(acts.childNodes.length)c.append(acts);
    if(me!=null&&!away&&!(t.left&&t.right))c.append(para('Waiting for someone to take the other paddle.','dim'));
    const il=idleLeft();if(il!=null&&il<IDLE_WARN_MS)c.append(el('div','err',idleWarn(il)));
  }
  if(note)c.append(el('div','err',named(note)));
  if(UI.err)c.append(el('div','err',UI.err));
  return c;
}
function toolCard(){
  const c=el('div','card'),b=button(UI.busy?'Dropping…':'Drop table',dropTable);
  b.disabled=UI.busy;
  c.append(para('Drop a Pong table into this note. Anyone here can take a paddle — first to 11.'),b);
  if(UI.toolMsg)c.append(el('div','err',UI.toolMsg));
  return c;
}
function msgCard(title,text){const c=el('div','card');c.append(el('h2',null,title),para(text));return c}
// Swap in new DOM only when it differs: a redundant rebuild between mousedown and
// mouseup would eat the click.
function place(box,node){
  const html=node?node.outerHTML:'';
  if(box._html===html)return;
  box._html=html;box.textContent='';if(node)box.append(node);
}
function renderUI(){
  const hadFocus=document.activeElement===shipInput,btns=el('span','btns');
  let card=null;
  if(!S.ready)card=msgCard(S.error?'OFFLINE':'CONNECTING',S.error||'Reaching your ship…');
  else if(UI.view==='tool')card=toolCard();
  else if(UI.view==='bad')card=msgCard('PONG','This artifact has no table in it.');
  else if(isCpu())btns.append(button('Quit',quitCpu,'ghost'));
  else if(UI.table){
    if(Net&&Net.role==='player')btns.append(button('Stand up',standUp,'ghost'));
    else if(Net&&Net.role==='watch')btns.append(button('Stop watching',()=>{UI.watch=false;syncSession();renderUI()},'ghost'));
    else card=tableCard();
    if(UI.fromLobby)btns.append(button('Back',backToLobby,'ghost'));
  }
  else card=lobbyCard();
  place($('barBtns'),btns.childNodes.length?btns:null);place($('panel'),card);$('panel').hidden=!card;
  const slot=$('panel').querySelector('[data-slot=ship]');if(slot)slot.replaceWith(shipInput);
  if(hadFocus&&shipInput.isConnected)shipInput.focus();
}

// ---------- main loop ----------
let lastT=performance.now(),statusAt=0;
function frame(now){
  const dt=Math.min(0.5,Math.max(0,(now-lastT)/1000));lastT=now;
  if(G){
    if(G.mode!=='watch'&&pointerY!=null)G.pad[G.me]=clampPad(pointerY);
    if(isCpu())cpuTick(dt,now);
    netTick(now);
    if(G&&(G.phase==='count'||G.phase==='point')&&G.serveBy!=null&&mine(G.serveBy)&&now>=G.serveAt)serve();
  }
  if(G){
    G.acc+=dt;
    while(G.acc>=STEP){G.acc-=STEP;if(G.phase==='play')simStep(STEP)}
    const k=1-Math.exp(-dt*30);
    for(const side of [LEFT,RIGHT]){
      if(G.mode==='cpu'||(G.mode==='net'&&side===G.me))G.show[side]=G.pad[side];
      else G.show[side]+=(G.pad[side]-G.show[side])*k;
    }
    const d=Math.exp(-dt*18);G.corr.x*=d;G.corr.y*=d;
  }
  draw();updateMsg(now);
  if(now-statusAt>250){statusAt=now;$('status').textContent=statusText()}
  requestAnimationFrame(frame);
}

// ---------- Noltbook bridge + boot ----------
// Works three ways: inside Noltbook (nb:init says which surface), inside any
// other same-origin iframe, or as a plain page. ?gid=&host= opens one table.
const NB={session:null,ctx:null},framed=window.parent!==window;
function nbSend(type,payload){if(framed)window.parent.postMessage({source:'noltbook-plugin',protocol:1,session:NB.session,type,payload:payload||{}},'*')}
addEventListener('message',e=>{
  if(!framed||e.source!==window.parent)return;
  const d=e.data;if(!d||d.source!=='noltbook-host'||d.protocol!==1)return;
  if(d.type==='nb:init'){if(!NB.ctx){NB.session=d.session;NB.ctx=d.payload||{};boot(NB.ctx)}return}
  if(d.session!==NB.session)return;
  if(d.type==='nb:publish-result'){
    const p=d.payload||{};
    if(p.ok){nbSend('nb:close');return}
    UI.busy=false;UI.toolMsg='Could not add the table to this note.';
    if(UI.dropped){act({close:{gid:UI.dropped}});UI.dropped=null}
    renderUI();
  }
});
async function dropTable(){
  if(UI.busy)return;
  UI.busy=true;UI.toolMsg='';renderUI();
  const gid=rid(10);
  if(!await act({host:{gid}})){UI.busy=false;UI.toolMsg='Could not open a table.';renderUI();return}
  UI.dropped=gid;
  nbSend('nb:publish',{name:'Pong',data:{kind:'pong-table',gid,host:S.our}});
}
function tableFrom(d){
  if(!d||typeof d!=='object')return null;
  if(d.kind!=null&&d.kind!=='pong-table')return null;
  const gid=String(d.gid||''),host=String(d.host||'');
  return /^[a-z0-9-]{1,32}$/.test(gid)&&SHIP_RE.test(host)?{gid,host}:null;
}
function boot(ctx){
  if(UI.view!=='boot')return;
  const mode=ctx&&ctx.mode;
  if(mode==='private-tool')UI.view='tool';
  else if(mode==='note-artifact'){const t=tableFrom(ctx.artifact&&ctx.artifact.data);UI.view=t?'table':'bad';UI.table=t}
  else{
    const q=new URLSearchParams(location.search);
    const t=tableFrom({gid:q.get('gid'),host:q.get('host')})||tableFrom(ctx&&ctx.context);
    UI.view=t?'table':'lobby';UI.table=t;
  }
  document.body.dataset.view=UI.view;
  if(UI.view==='tool')nbSend('nb:resize',{width:400,height:200});   // Noltbook's 42px header comes out of this
  else if(mode==='note-artifact')nbSend('nb:resize',{height:500});
  fitCanvas();renderUI();connect();
}
addEventListener('resize',fitCanvas);
fitCanvas();requestAnimationFrame(frame);
if(framed){
  window.parent.postMessage({source:'noltbook-plugin',protocol:1,type:'nb:ready'},'*');
  setTimeout(()=>{if(UI.view==='boot')boot(null)},1500);
}else boot(null);
</script>
